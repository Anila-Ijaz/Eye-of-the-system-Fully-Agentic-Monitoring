<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye of the System</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --surface-2: #efeee9;
  --border: #dcdad3;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7b7a74;
  --series-1: #2a78d6;
  --band: rgba(82, 81, 78, 0.12);
  --expected: #7b7a74;
  --accent: #2a78d6;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --low: #9a9890;
  --chip-bg: #e8e6df;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #242422;
    --border: #383835;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --band: rgba(195, 194, 183, 0.14);
    --expected: #a3a29a;
    --accent: #3987e5;
    --low: #77766f;
    --chip-bg: #2c2c29;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --surface-2: #242422;
  --border: #383835;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --series-1: #3987e5;
  --band: rgba(195, 194, 183, 0.14);
  --expected: #a3a29a;
  --accent: #3987e5;
  --low: #77766f;
  --chip-bg: #2c2c29;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, select { font: inherit; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding: 12px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5;
}
header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
header h1 small { color: var(--text-muted); font-weight: 400; margin-left: 6px; }
.clock { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.progress { width: 160px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary);
  border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
.btn:hover { border-color: var(--text-muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--surface-1);
}
.toolbar .label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.toolbar .btn { font-size: 13px; padding: 4px 9px; }
.toolbar .btn.fault::before { content: "⚠ "; }
.toolbar .btn.innocent::before { content: "◌ "; }
.toolbar .btn.metric::before { content: "+ "; }
main {
  display: grid; grid-template-columns: 300px minmax(0, 1fr) 360px; gap: 12px; padding: 12px 16px;
  height: calc(100vh - 118px);
}
.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; display: flex;
  flex-direction: column; min-height: 0; }
.panel > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-secondary);
  margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.issue { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.issue:hover { background: var(--surface-2); }
.issue.sel { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.issue .t { font-weight: 600; margin: 4px 0 2px; }
.issue .m { color: var(--text-muted); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .4px; padding: 1px 7px; border-radius: 10px; background: var(--chip-bg);
  color: var(--text-primary); }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.st { font-size: 11px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 0 7px; }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); }
.tab { padding: 7px 12px; border: none; background: none; color: var(--text-secondary); cursor: pointer;
  border-bottom: 2px solid transparent; }
.tab.on { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
.view { padding: 14px 16px; }
.view h3 { margin: 0 0 6px; font-size: 18px; }
.view h4 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-secondary); }
.headline { font-size: 15px; margin: 8px 0 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
.view ul { margin: 0; padding-left: 18px; }
.view li { margin: 3px 0; }
.kv { display: flex; gap: 22px; flex-wrap: wrap; }
.kv div b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.kv div span { color: var(--text-muted); font-size: 12px; }
.trail li { margin: 6px 0; }
.trail code { font-size: 12px; color: var(--text-secondary); }
.muted { color: var(--text-muted); }
.chart { margin: 10px 0 4px; position: relative; }
.chart svg { width: 100%; height: 190px; display: block; overflow: visible; }
.chart .cap { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.chart .cap .sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--series-1); vertical-align: middle; margin-right: 4px; }
.chart .cap .sw.exp { border-top: 2px dashed var(--expected); }
.chart .cap .sw.band { height: 10px; border: none; background: var(--band); }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 3; }
.feed .f { padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.feed .f .h { display: flex; gap: 8px; align-items: center; color: var(--text-muted); font-size: 11px; }
.feed .f .k { text-transform: uppercase; letter-spacing: .4px; font-weight: 600; }
.feed .f.alert { box-shadow: inset 3px 0 0 var(--critical); }
.feed .f.decision { box-shadow: inset 3px 0 0 var(--accent); }
.tree ul { list-style: none; padding-left: 18px; margin: 0; border-left: 1px dashed var(--border); }
.tree > ul { border-left: none; padding-left: 0; }
.tree li { margin: 3px 0; }
.node { display: inline-flex; gap: 6px; align-items: center; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); }
.node.anom { outline: 2px solid var(--critical); }
.node.root { outline: 2px solid var(--critical); background: var(--critical); color: #fff; }
.node small { color: var(--text-muted); }
.node.root small { color: #fff; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; }
.ok { color: var(--good); font-weight: 600; }
.bad { color: var(--critical); font-weight: 600; }
.empty { padding: 24px; color: var(--text-muted); text-align: center; }
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); font-weight: 400;
  text-transform: none; letter-spacing: 0; margin-left: auto; }
@media (max-width: 1100px) {
  main { grid-template-columns: 1fr; height: auto; }
  .panel { max-height: 70vh; }
}
@media (max-width: 600px) {
  header, .toolbar, main { padding-left: 16px; padding-right: 16px; }
  .progress { width: 100px; }
}
</style>
</head>
<body>
<header>
  <h1>Eye of the System <small>autonomous marketplace monitoring</small></h1>
  <span class="clock" id="clock">starting…</span>
  <div class="progress" title="simulated time"><div id="prog"></div></div>
  <div class="counts" id="counts"></div>
  <span class="spacer"></span>
  <button class="btn primary" id="play">Pause</button>
  <button class="btn" id="step" title="advance one simulated hour">Step 1h</button>
  <select class="btn" id="speed" title="extra delay between simulated hours">
    <option value="0">Fastest</option><option value="1">1 s / hour</option><option value="2">2 s / hour</option><option value="4">4 s / hour</option>
  </select>
  <button class="btn" id="theme" title="toggle light/dark">◐</button>
</header>
<div class="toolbar" id="toolbar"><span class="label">Inject while it runs</span></div>
<main>
  <section class="panel">
    <h2>Issues <span class="muted" id="ncount"></span><label class="chk"><input type="checkbox" id="quiet"> show quiet</label></h2>
    <div class="scroll" id="issues"><div class="empty">Watching… no issues yet.</div></div>
  </section>
  <section class="panel">
    <div class="tabs">
      <button class="tab on" data-v="detail">Issue report</button>
      <button class="tab" data-v="graph">Metric graph</button>
      <button class="tab" data-v="watch">What it watches</button>
      <button class="tab" data-v="score">Scorecard</button>
    </div>
    <div class="scroll"><div class="view" id="view"><div class="empty">Select an issue on the left.</div></div></div>
  </section>
  <section class="panel">
    <h2>Agent decisions <label class="chk"><input type="checkbox" id="onlydec" checked> decisions &amp; alerts only</label></h2>
    <div class="scroll feed" id="feed"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 0) => (v === null || v === undefined || Number.isNaN(+v)) ? "–" : (+v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const seg = (s) => Object.entries(s || {}).map(([k, v]) => `${k}=${v}`).join(", ") || "all segments";
const SEV = { critical: ["var(--critical)", "▲"], high: ["var(--serious)", "◆"], medium: ["var(--warning)", "●"], low: ["var(--low)", "○"] };
let state = null, selected = null, tab = "detail", lastIssueFetch = 0, issueCache = null;

function badge(sev) {
  const [c, icon] = SEV[sev] || SEV.low;
  return `<span class="badge" title="severity ${sev}"><i style="background:${c}"></i>${icon} ${esc(sev)}</span>`;
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  return r.json();
}

// ---------------- header, toolbar ----------------
function renderHeader(s) {
  $("clock").textContent = `simulated time ${s.now.replace("T", " ").slice(0, 16)} UTC · hour ${s.hours_done}/${s.hours_total}` +
    (s.tick_seconds ? ` · ${s.tick_seconds}s per hour` : "") + (s.finished ? " · finished" : "");
  $("prog").style.width = `${100 * s.hours_done / Math.max(1, s.hours_total)}%`;
  const c = s.counts;
  $("counts").innerHTML = [["investigating", c.investigating], ["new", c.new], ["ongoing", c.ongoing], ["resolved", c.resolved]]
    .map(([k, v]) => `<span class="st">${k} ${v}</span>`).join("");
  $("play").textContent = s.paused ? "Resume" : "Pause";
}
let toolbarBuilt = false;
function renderToolbar(s) {
  const tb = $("toolbar");
  if (!toolbarBuilt) {
    for (const p of s.presets) {
      const b = document.createElement("button");
      b.className = `btn ${p.kind}`; b.textContent = p.label; b.title = `${p.kind}: starts next hour; the monitor is not told`;
      b.onclick = async () => { await api("/api/inject", { key: p.key }); refresh(); };
      tb.appendChild(b);
    }
    const lab = document.createElement("span"); lab.className = "label"; lab.textContent = "New metric"; lab.style.marginLeft = "12px";
    tb.appendChild(lab);
    for (const m of s.examples) {
      const b = document.createElement("button");
      b.className = "btn metric"; b.textContent = m.name; b.dataset.metric = m.name; b.title = m.description;
      b.onclick = async () => { b.disabled = true; await api("/api/metric", { name: m.name }); refresh(); };
      tb.appendChild(b);
    }
    toolbarBuilt = true;
  }
  for (const m of s.examples) {
    const b = tb.querySelector(`[data-metric="${m.name}"]`);
    if (b) { b.disabled = m.added; b.style.opacity = m.added ? .5 : 1; }
  }
}

// ---------------- issues ----------------
function renderIssues(s) {
  const el = $("issues");
  const showQuiet = $("quiet").checked;
  const quiet = s.issues.filter((i) => !i.alerts && i.status === "resolved").length;
  const shown = s.issues.filter((i) => showQuiet || i.alerts || i.status !== "resolved");
  $("ncount").textContent = s.issues.length ? `(${shown.length}${quiet && !showQuiet ? `, ${quiet} quiet hidden` : ""})` : "";
  s = { ...s, issues: shown };
  if (!s.issues.length) { el.innerHTML = `<div class="empty">Watching ${Object.keys(s.watchlist).length} metrics… no issues yet.</div>`; return; }
  el.innerHTML = s.issues.map((i) => `
    <div class="issue ${i.id === selected ? "sel" : ""}" data-id="${i.id}">
      <div>${badge(i.severity)} <span class="st">${esc(i.status)}</span> <span class="muted">${esc(i.id)}${i.kind === "data_quality" ? " · data" : ""}</span></div>
      <div class="t">${esc(i.title)}</div>
      <div class="m">opened ${esc(i.opened_at.slice(5, 16).replace("T", " "))}${i.resolved_at ? ` · resolved ${esc(i.resolved_at.slice(5, 16).replace("T", " "))}` : ""} · ${i.alerts} alert${i.alerts === 1 ? "" : "s"} · ${i.episodes} signals</div>
    </div>`).join("");
  el.querySelectorAll(".issue").forEach((d) => d.onclick = () => { selected = d.dataset.id; tab = "detail"; setTab(); issueCache = null; renderIssues(state); loadIssue(true); });
}

// ---------------- feed ----------------
function renderFeed(s) {
  const only = $("onlydec").checked;
  const items = s.feed.filter((f) => !only || f.level !== "info" || ["inject", "metric", "system"].includes(f.kind)).slice(-150).reverse();
  $("feed").innerHTML = items.map((f) => `
    <div class="f ${f.level}">
      <div class="h"><span class="k">${esc(f.kind)}</span><span>${esc(f.time.slice(5, 16).replace("T", " "))}</span>${f.issue ? `<span>${esc(f.issue)}</span>` : ""}</div>
      <div>${esc(f.text)}</div>
    </div>`).join("") || `<div class="empty">Starting…</div>`;
}

// ---------------- chart ----------------
function chart(series) {
  const id = "c" + Math.random().toString(36).slice(2, 8);
  return `<div class="chart" id="${id}" data-s='${esc(JSON.stringify(series))}'>
    <div class="cap"><b>${esc(series.metric)}</b> <span class="muted">${esc(seg(series.segment))}, last ${series.time.length} hours</span>
      <span><span class="sw"></span>actual</span><span><span class="sw exp"></span>expected</span><span><span class="sw band"></span>normal range</span></div>
    <svg role="img" aria-label="${esc(series.metric)} actual versus expected"></svg><div class="tip"></div></div>`;
}
function drawCharts() {
  document.querySelectorAll(".chart[data-s]").forEach((box) => {
    const s = JSON.parse(box.dataset.s);
    const svg = box.querySelector("svg"), tip = box.querySelector(".tip");
    const W = Math.max(320, box.clientWidth), H = 190, L = 56, R = 10, T = 8, B = 24;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const n = s.time.length;
    const vals = [...s.actual, ...s.lower, ...s.upper, ...s.expected].filter((v) => v !== null);
    if (!vals.length || n < 2) { svg.innerHTML = ""; return; }
    let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) hi = lo + 1;
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad; if (Math.min(...vals) >= 0 && lo < 0) lo = 0;
    const x = (i) => L + (W - L - R) * i / (n - 1), y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const path = (arr) => { let d = "", pen = false; arr.forEach((v, i) => { if (v === null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; }); return d; };
    let band = "";
    let run = [];
    const flush = () => { if (run.length > 1) band += `<path d="M${run.map((i) => `${x(i).toFixed(1)},${y(s.upper[i]).toFixed(1)}`).join("L")}L${run.slice().reverse().map((i) => `${x(i).toFixed(1)},${y(s.lower[i]).toFixed(1)}`).join("L")}Z" fill="var(--band)"/>`; run = []; };
    s.upper.forEach((u, i) => { if (u !== null && s.lower[i] !== null) run.push(i); else flush(); }); flush();
    const ticks = [0, 1, 2, 3].map((k) => lo + (hi - lo) * k / 3);
    const digits = Math.abs(hi) < 10 ? 3 : 0;
    let grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${fmt(v, digits)}</text>`).join("");
    for (let i = 0; i < n; i++) {
      if (s.time[i].slice(11, 13) === "00") grid += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${s.time[i].slice(5, 10)}</text>
        <line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 4"/>`;
    }
    let marks = "";
    s.actual.forEach((v, i) => {
      if (v === null || s.upper[i] === null || s.lower[i] === null) return;
      if (v > s.upper[i] || v < s.lower[i]) marks += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--critical)" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
    svg.innerHTML = `${grid}${band}<path d="${path(s.expected)}" fill="none" stroke="var(--expected)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="${path(s.actual)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>${marks}
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--text-muted)" stroke-width="1" visibility="hidden"/>
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
    const xh = svg.querySelector(".xh");
    svg.onmousemove = (ev) => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
      const i = Math.max(0, Math.min(n - 1, Math.round((px - L) / (W - L - R) * (n - 1))));
      xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
      const out = s.actual[i] !== null && s.upper[i] !== null && (s.actual[i] > s.upper[i] || s.actual[i] < s.lower[i]);
      tip.innerHTML = `<b>${s.time[i].slice(5, 16).replace("T", " ")}</b><br>actual ${fmt(s.actual[i], digits || 0)}${out ? " <b>outside range</b>" : ""}<br>expected ${fmt(s.expected[i], digits || 0)}<br>range ${fmt(s.lower[i], digits || 0)} – ${fmt(s.upper[i], digits || 0)}`;
      tip.style.display = "block";
      const left = (x(i) / W) * box.clientWidth;
      tip.style.left = `${Math.min(box.clientWidth - 170, Math.max(0, left + 10))}px`; tip.style.top = "30px";
    };
    svg.onmouseleave = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
  });
}

// ---------------- views ----------------
function setTab() { document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.v === tab)); }
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => { tab = t.dataset.v; setTab(); renderView(true); });

async function loadIssue(force) {
  if (!selected || tab !== "detail") return;
  if (!force && Date.now() - lastIssueFetch < 3000) return;
  lastIssueFetch = Date.now();
  issueCache = await api(`/api/issue?id=${encodeURIComponent(selected)}`);
  renderDetail();
}
function list(items) { return items && items.length ? `<ul>${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div class="muted">none</div>`; }
function renderDetail() {
  const d = issueCache; if (!d || d.error) { $("view").innerHTML = `<div class="empty">Select an issue on the left.</div>`; return; }
  const r = d.report, imp = r.business_impact || {};
  const root = r.root_cause || {};
  $("view").innerHTML = `
    <div>${badge(r.severity)} <span class="st">${esc(r.status)}</span> <span class="muted">${esc(r.issue_id)} · opened ${esc((r.opened_at || "").replace("T", " ").slice(0, 16))}${r.resolved_at ? " · resolved " + esc(r.resolved_at.replace("T", " ").slice(0, 16)) : ""}</span></div>
    <h3>${esc(r.title)}</h3>
    <div class="headline">${esc(r.headline)}</div>
    ${r.narrative ? `<p>${esc(r.narrative)}</p>` : ""}
    <div class="kv">
      ${imp.lost_orders !== undefined ? `<div><b>${fmt(imp.lost_orders)}</b><span>orders lost</span></div>` : ""}
      ${imp.lost_revenue_eur !== undefined ? `<div><b>€${fmt(imp.lost_revenue_eur)}</b><span>revenue lost</span></div>` : ""}
      ${root.node ? `<div><b>${esc(root.node)}</b><span>root (${esc(root.status || "?")}) in ${esc(seg(root.segment))}</span></div>` : ""}
      ${root.explained_share ? `<div><b>${fmt(100 * root.explained_share)}%</b><span>of the change explained</span></div>` : ""}
    </div>
    ${(d.charts || []).map(chart).join("")}
    <h4>What happened</h4>${list(r.what_happened)}
    <h4>Evidence</h4>${list(r.evidence)}
    <h4>What is still uncertain</h4>${list(r.uncertainty)}
    ${r.ruled_out && r.ruled_out.length ? `<h4>Ruled out</h4>${list(r.ruled_out)}` : ""}
    <h4>Recommended actions</h4>${list(r.recommended_actions)}
    <h4>Investigation trail</h4>${r.trail && r.trail.length ? `<ol class="trail">${r.trail.map((t) => `<li><b>${esc(t.action)}</b> <code>${esc(t.query)}</code><br>→ ${esc(t.observation)}${t.reason ? `<br><span class="muted">why: ${esc(t.reason)}</span>` : ""}</li>`).join("")}</ol>` : `<div class="muted">no investigation needed</div>`}
    <h4>Also affected (grouped into this issue)</h4>${r.symptoms && r.symptoms.length ? `<ul>${r.symptoms.map((x) => `<li>${esc(x.metric)} ${esc(x.direction)} in ${esc(seg(x.segment))} (${esc(x.rel_change_pct)}%)</li>`).join("")}</ul>` : `<div class="muted">none</div>`}
    <h4>History</h4><ul>${(d.issue.history || []).map((h) => `<li>${esc(h.time.slice(5, 16).replace("T", " "))} ${esc(h.event)}${h.detail ? ": " + esc(h.detail) : ""}</li>`).join("")}</ul>`;
  drawCharts();
}
async function renderGraph() {
  const g = await api("/api/tree");
  const byId = Object.fromEntries(g.nodes.map((n) => [n.id, n]));
  const inputs = {};
  for (const e of g.edges) if (e.type === "formula") (inputs[e.to] = inputs[e.to] || []).push(e);
  const used = new Set(g.edges.filter((e) => e.type === "formula").map((e) => e.from));
  const seen = new Set();
  const node = (id) => {
    const n = byId[id] || { id };
    const cls = n.root_cause ? "root" : n.anomalous ? "anom" : "";
    const tag = n.root_cause ? "<small>root cause</small>" : n.anomalous ? `<small>z=${fmt(n.anomalous, 0)}</small>` : (n.watched ? "<small>watched</small>" : "");
    return `<span class="node ${cls}">${esc(id)} ${tag}</span>`;
  };
  const walk = (id, depth) => {
    if (seen.has(id) || depth > 12) return `<li>${node(id)} <span class="muted">(see above)</span></li>`;
    seen.add(id);
    const kids = [...new Set((inputs[id] || []).flatMap((e) => {
      const f = e.formula || ""; const rhs = f.split("=")[1] || ""; return rhs.match(/[a-z_]+/g) || [];
    }))];
    const f = (inputs[id] || [])[0];
    return `<li>${node(id)} ${f ? `<span class="muted">= ${esc((f.formula || "").split("=")[1])}${f.source !== "seed" ? " · <b>auto-discovered</b>" : ""}</span>` : ""}${kids.length ? `<ul>${kids.map((k) => walk(k, depth + 1)).join("")}</ul>` : ""}</li>`;
  };
  const roots = ["revenue", ...Object.keys(inputs).filter((t) => !used.has(t) && t !== "revenue")];
  const causes = g.edges.filter((e) => e.type === "possible_cause");
  $("view").innerHTML = `<h3>Metric graph</h3>
    <p class="muted">Formula edges (how metrics are built), validated on the data. Red outline = anomalous now, filled = root cause of an open issue. New metrics appear here once the system places them.</p>
    <div class="tree"><ul>${roots.map((r) => walk(r, 0)).join("")}</ul></div>
    <h4>Possible causes (hypotheses, not facts)</h4>
    <ul>${causes.map((e) => `<li>${node(e.from)} → ${node(e.to)} <span class="muted">${esc(e.status)}${e.source !== "seed" ? " · auto-discovered" : ""}</span></li>`).join("")}</ul>`;
}
function renderWatch() {
  const s = state; if (!s) return;
  $("view").innerHTML = `<h3>What it watches and why</h3>
    <p class="muted">Re-chosen every simulated day from graph importance, business weight and noisiness, plus the root causes of open issues. Each metric is scored hourly in 4 groupings (total, country, country × platform, category) over 1 h and 6 h windows.</p>
    <table><tr><th>metric</th><th>why</th></tr>${Object.entries(s.watchlist).map(([m, why]) => `<tr><td>${esc(m)}</td><td class="muted">${esc(why)}</td></tr>`).join("")}</table>
    <h4>Open anomalies right now</h4>
    ${s.open_anomalies.length ? `<table><tr><th>metric</th><th>segment</th><th>change</th><th>z</th></tr>${s.open_anomalies.map((a) => `<tr><td>${esc(a.metric)}</td><td>${esc(seg(a.segment))}</td><td>${esc(a.rel_change_pct)}%</td><td>${fmt(a.peak_z, 1)}</td></tr>`).join("")}</table>` : `<div class="muted">none</div>`}
    ${s.scripted.length ? `<h4>Still scheduled by the demo script (the monitor doesn't see this)</h4><ul>${s.scripted.map((x) => `<li>${esc(x.at)} ${esc(x.action)} ${esc(x.what)}</li>`).join("")}</ul>` : ""}`;
}
async function renderScore() {
  const sc = await api("/api/score");
  const rows = sc.scenarios.map((r) => {
    const ok = r.result === "FOUND" || r.result === "PASS";
    let detail = "";
    if (r.kind === "fault" && r.result === "FOUND") detail = `${r.issue}: root ${r.root} (${r.confirmed ? "confirmed" : "hypothesis"}), alert after ${r.hours_to_alert} h${r.trigger_named ? ", trigger event named" : ""}${r.resolved ? ", resolved" : ""}`;
    else if (r.preset === "late_missing_data") detail = `data issue ${r.data_issue || "–"}${r.resolved ? " resolved by backfill" : ""}`;
    else if (r.kind === "innocent") detail = ok ? "no incident raised" : `false incidents: ${(r.false_incidents || []).join(", ")}`;
    return `<tr><td class="${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"} ${esc(r.result)}</td><td>${esc(r.kind)}</td><td>${esc(r.preset)}</td><td>${esc(r.segment)}</td><td>${esc(detail)}</td></tr>`;
  }).join("");
  const s = sc.summary;
  $("view").innerHTML = `<h3>Scorecard</h3>
    <p class="muted">The only place that reads the simulator's ground truth: what was injected, compared with what the monitor reported on its own.</p>
    <div class="kv"><div><b>${esc(s.faults_found)}</b><span>faults found</span></div><div><b>${s.root_causes_confirmed}</b><span>with confirmed root cause</span></div>
      <div><b>${esc(s.innocent_passed)}</b><span>innocent changes not reported</span></div><div><b>${s.alerts_sent}</b><span>alerts sent</span></div></div>
    ${rows ? `<table style="margin-top:12px"><tr><th>result</th><th>kind</th><th>scenario</th><th>segment</th><th>detail</th></tr>${rows}</table>` : `<div class="empty">Nothing injected yet.</div>`}
    ${s.other_alerted_issues.length ? `<h4>Other alerted issues</h4>${list(s.other_alerted_issues)}` : ""}`;
}
function renderView(force) {
  if (tab === "detail") { if (selected) loadIssue(force); else $("view").innerHTML = `<div class="empty">Select an issue on the left.</div>`; }
  else if (tab === "graph" && force) renderGraph();
  else if (tab === "watch") renderWatch();
  else if (tab === "score" && force) renderScore();
}

// ---------------- loop ----------------
async function refresh() {
  try {
    state = await api("/api/state");
    renderHeader(state); renderToolbar(state); renderIssues(state); renderFeed(state);
    if (!selected && state.issues.length) { selected = state.issues[0].id; }
    renderView(false);
  } catch (e) { $("clock").textContent = "waiting for the server…"; }
}
$("play").onclick = async () => { await api("/api/control", { action: state && state.paused ? "resume" : "pause" }); refresh(); };
$("step").onclick = async () => { await api("/api/control", { action: "step" }); setTimeout(refresh, 400); };
$("speed").onchange = (e) => api("/api/control", { action: "speed", value: e.target.value });
$("onlydec").onchange = () => state && renderFeed(state);
$("quiet").onchange = () => state && renderIssues(state);
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("eye-theme", document.documentElement.dataset.theme); } catch (e) {}
  if (tab === "detail") renderDetail();
};
try { const t = localStorage.getItem("eye-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
if (["#graph", "#watch", "#score"].includes(location.hash)) { tab = location.hash.slice(1); setTab(); setTimeout(() => renderView(true), 300); }
window.addEventListener("resize", () => drawCharts());
refresh(); setInterval(refresh, 1500);
setInterval(() => { if (tab === "graph") renderGraph(); }, 5000);
</script>
</body>
